seed: 3407
model:
  dit:
    dim: 768
    in_dim: 16
    ffn_dim: 3072
    out_dim: 16
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    patch_size: [1, 2, 2]
    num_heads: 6
    num_layers: 30
    has_text_input: false
    has_image_input: false
    num_inference_steps: 20
    type: bidirectional
  vae:
    z_dim: 16
    queued: false
    ckpt_file: models/Wan2.1_VAE.pth
  type: default
  num_condition_frames: 17
data:
  dataset: data/projectile_gravity_continuous_v2/latents/train
  labels: data/projectile_gravity_continuous_v2/latents/train/metadata.csv
  size: [128, 128]
  num_frames: 33
  load_as: tensor
  encoded: true
loader:
  num_training_steps: 50000
  batch_size: 32
  num_workers: 4
optimizer:
  learning_rate: 0.0002
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  with_ema: false
log:
  project: projectile-gravity-continuous-v2
  name: raw-short
  log_every: 10
  save_at: [10000, 20000, 50000]
  save_last_every: 50000
  ckpt_dir: runs/projectile_gravity_continuous_v2/raw_short/ckpt
  out_dir: runs/projectile_gravity_continuous_v2/raw_short/output
  fps: 96
