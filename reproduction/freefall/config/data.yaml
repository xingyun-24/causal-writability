version: projectile_gravity_continuous_v2
render:
  width: 128
  height: 128
  # Video playback rate; physics uses its own simulation_fps below.
  fps: 20
  num_frames: 129
  ball_radius_px: 7
  background_rgb: [28, 30, 34]
  red_rgb: [235, 48, 48]
  blue_rgb: [48, 106, 235]
physics:
  simulation_fps: 96
  # These are continuous, disjoint training intervals, not two fixed values.
  red_gravity_range: [0.20, 0.35]
  blue_gravity_range: [0.65, 0.80]
  x0_range: [0.12, 0.20]
  y0_range: [0.30, 0.40]
  vx_range: [0.40, 0.48]
  vy_range: [0.42, 0.50]
history:
  prediction_start: 65
  # Frozen V1 Short: 0..56 background, 57..64 eight real history frames.
  short_observation_window_pixels: 8
  short_masked_prefix_pixels: 57
splits:
  train_base_seeds: 1024
  eval_base_seeds: 128
