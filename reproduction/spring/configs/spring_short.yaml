seed: 3407
model:
  dit:
    dim: 1152
    in_dim: 16
    ffn_dim: 4608
    out_dim: 16
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    patch_size:
    - 1
    - 2
    - 2
    num_heads: 9
    num_layers: 30
    has_text_input: false
    has_image_input: false
    num_inference_steps: 20
    type: bidirectional
  vae:
    z_dim: 16
    queued: false
    ckpt_file: weights/vae.pth
  type: default
  num_condition_frames: 17
data:
  dataset: data/latents/train_short
  labels: data/latents/train_short/metadata.csv
  size:
  - 128
  - 128
  num_frames: 33
  load_as: tensor
  encoded: true
loader:
  num_training_steps: 50000
  batch_size: 32
  num_workers: 4
optimizer:
  learning_rate: 0.0002
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  with_ema: false
log:
  project: causal-writability
  name: spring-short
  log_every: 10
  save_at:
  - 5000
  - 10000
  - 20000
  - 50000
  save_last_every: 1000
  ckpt_dir: runs/checkpoints
  out_dir: runs/training
  fps: 20
